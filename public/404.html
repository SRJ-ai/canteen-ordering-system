<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GPREC Food Court - Loading...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 1.5rem;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(249, 115, 22, 0.2);
      border-top-color: #f97316;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { font-size: 1.25rem; font-weight: 700; margin: 0 0 0.5rem; }
    p { font-size: 0.85rem; color: #94a3b8; margin: 0; }
  </style>
  <script>
    (function() {
      var path = window.location.pathname;
      var repo = '/canteen-ordering-system';
      
      // Check if URL is an order URL: /canteen-ordering-system/orders/<id>
      var orderMatch = path.match(/canteen-ordering-system\/orders\/([a-zA-Z0-9-]+)/);
      if (orderMatch && orderMatch[1] && orderMatch[1] !== 'sample-order') {
        window.location.replace(repo + '/orders/?id=' + encodeURIComponent(orderMatch[1]));
        return;
      }

      // Check if URL is a table QR URL: /canteen-ordering-system/t/<token>
      var tableMatch = path.match(/canteen-ordering-system\/t\/([a-zA-Z0-9-_]+)/);
      if (tableMatch && tableMatch[1]) {
        window.location.replace(repo + '/t/?token=' + encodeURIComponent(tableMatch[1]));
        return;
      }

      // Default fallback to home or menu
      window.location.replace(repo + '/menu/');
    })();
  </script>
</head>
<body>
  <div class="spinner"></div>
  <h2>Loading GPREC Food Court...</h2>
  <p>Connecting to campus ordering service...</p>
</body>
</html>
